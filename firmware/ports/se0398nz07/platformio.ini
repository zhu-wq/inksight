[platformio]
default_envs = epd_398_bwry_s3_n16r8_a1_new

[env:epd_398_bwry_s3_n16r8_a1_new]
extends = s3_n16r8_398_base
build_src_filter = +<*> -<epd_driver.cpp>
build_flags =
    ${s3_n16r8_398_base.build_flags}
    -DEPD_A1_NEW_BATCH

[env:epd_398_bwry_s3_n16r8_A1_old]
extends = s3_n16r8_398_base
build_src_filter = +<*> -<epd_driver.cpp>

# Creator's original 768x552 panel settings on the S3 board.
[env:epd_398_bwry_s3_n16r8_A0]
extends = s3_n16r8_398_base
build_src_filter = +<*> -<jd79665_a1.cpp>
build_flags =
    ${s3_n16r8_398_base.build_flags}
    -DEPD_PANEL_75_JDY79668

[s3_n16r8_398_base]
extends = common
board = esp32-s3-devkitc-1
upload_speed = 460800
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions/default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600
build_flags =
    -DBOARD_PROFILE_ESP32_S3_N16R8
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DEPD_WIDTH=768
    -DEPD_HEIGHT=552
    -DEPD_BPP=2
    -DALLOW_INSECURE_FALLBACK=0

[common]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
board_build.extra_flags =
extra_scripts = post:merge_firmware.py
